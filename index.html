<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slime Maze</title>
<style>
  body { margin:0; background:#12121c; color:#eee; font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
  #hud { width:532px; max-width:100%; display:flex; justify-content:space-between; padding:8px 4px; font-size:18px; }
  canvas { background:#1b1b2b; border-radius:10px; max-width:100%; touch-action:none; }
  p { color:#889; font-size:13px; }
</style>
</head>
<body>
<div id="hud"><span id="score">Score: 0</span><span id="lives">Lives: 3</span></div>
<canvas id="c" width="532" height="420"></canvas>
<p>"Use Arrow Keys, WASD, or swipe to move. Gobble up the gems, dodge the creepy spiky bugs, and grab a big gem to scare those little monsters away! Restart: Press Space. 💎👾😂"</p>
<script>
const MAP = [
"###################",
"#........#........#",
"#o##.###.#.###.##o#",
"#.................#",
"#.##.#.#####.#.##.#",
"#....#...#...#....#",
"####.#.#####.#.####",
"#.................#",
"#.##.###.#.###.##.#",
"#o...............o#",
"#.##.#.#####.#.##.#",
"#.................#",
"#.##.###.#.###.##.#",
"#.................#",
"###################"
];
const S = 28, W = 19, H = 15;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives');

let grid, gemsLeft, score, lives, player, enemies, fright, state, want, t0 = 0;
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
const free = (x,y) => y>=0 && y<H && x>=0 && x<W && grid[y][x] !== '#';

function mkEnt(x,y,speed){ return {sx:x, sy:y, tx:x, ty:y, dx:0, dy:0, p:0, speed}; }

function reset(full){
  if(full){
    grid = MAP.map(r => r.split(''));
    gemsLeft = 0;
    grid.forEach(r => r.forEach(c => { if(c==='.'||c==='o') gemsLeft++; }));
    score = 0; lives = 3; state = 'play';
  }
  player = mkEnt(9,13,5.2);
  enemies = [mkEnt(1,1,3.6), mkEnt(17,1,3.6), mkEnt(9,7,3.6)];
  enemies.forEach((e,i)=>{ e.eaten=false; });
  want = [0,0]; fright = 0;
  updateHud();
}
function updateHud(){ scoreEl.textContent = 'Score: '+score; livesEl.textContent = 'Lives: '+'♥'.repeat(Math.max(lives,0)); }

function arrive(e){
  e.tx += e.dx; e.ty += e.dy; e.p = 0;
}

function stepPlayer(dt){
  const e = player;
  // allow instant reversal
  if((e.dx||e.dy) && want[0] === -e.dx && want[1] === -e.dy && (want[0]||want[1])){
    e.tx += e.dx; e.ty += e.dy; e.dx = want[0]; e.dy = want[1]; e.p = 1 - e.p;
  }
  if(!(e.dx||e.dy)) e.p = 0;
  e.p += e.speed*dt;
  while(e.p >= 1 || !(e.dx||e.dy)){
    if(e.dx||e.dy){ arrive(e); eat(); }
    if((want[0]||want[1]) && free(e.tx+want[0], e.ty+want[1])){ e.dx=want[0]; e.dy=want[1]; }
    else if(!free(e.tx+e.dx, e.ty+e.dy)){ e.dx=0; e.dy=0; e.p=0; break; }
    if(!(e.dx||e.dy)) break;
    if(e.p < 1) break;
    e.p -= 1;
  }
}

function eat(){
  const c = grid[player.ty][player.tx];
  if(c==='.'){ score+=10; gemsLeft--; grid[player.ty][player.tx]=' '; }
  else if(c==='o'){ score+=50; gemsLeft--; fright=6; grid[player.ty][player.tx]=' '; }
  updateHud();
  if(gemsLeft<=0) state='win';
}

function stepEnemy(e, dt){
  const sp = fright>0 ? e.speed*0.6 : e.speed;
  e.p += sp*dt;
  while(e.p >= 1 || !(e.dx||e.dy)){
    if(e.dx||e.dy){ arrive(e); e.p -= 1; if(e.p<0) e.p=0; }
    const opts = DIRS.filter(d => free(e.tx+d[0], e.ty+d[1]) && !(d[0]===-e.dx && d[1]===-e.dy));
    const all = opts.length ? opts : DIRS.filter(d => free(e.tx+d[0], e.ty+d[1]));
    let pick;
    if(fright>0 || Math.random()<0.35) pick = all[Math.floor(Math.random()*all.length)];
    else {
      pick = all.slice().sort((a,b)=>{
        const da = Math.hypot(e.tx+a[0]-player.tx, e.ty+a[1]-player.ty);
        const db = Math.hypot(e.tx+b[0]-player.tx, e.ty+b[1]-player.ty);
        return da-db;
      })[0];
    }
    e.dx = pick[0]; e.dy = pick[1];
    if(e.p < 1) break;
  }
}

const pos = e => [e.tx + e.dx*e.p, e.ty + e.dy*e.p];

function update(dt){
  if(state!=='play') return;
  dt = Math.min(dt, 0.05);
  if(fright>0) fright = Math.max(0, fright-dt);
  stepPlayer(dt);
  enemies.forEach(e => stepEnemy(e, dt));
  const [px,py] = pos(player);
  for(const e of enemies){
    const [ex,ey] = pos(e);
    if(Math.hypot(px-ex, py-ey) < 0.6){
      if(fright>0){
        score += 200; updateHud();
        e.tx=9; e.ty=7; e.dx=0; e.dy=0; e.p=0;
      } else {
        lives--; updateHud();
        if(lives<=0){ state='lose'; } else reset(false);
        return;
      }
    }
  }
}

function draw(now){
  ctx.clearRect(0,0,cv.width,cv.height);
  // walls
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c = grid[y][x];
    if(c==='#'){
      ctx.fillStyle = '#3b3b8f';
      ctx.beginPath(); ctx.roundRect(x*S+2, y*S+2, S-4, S-4, 6); ctx.fill();
    } else if(c==='.'){
      ctx.fillStyle = '#ff7ac8';
      const cx=x*S+S/2, cy=y*S+S/2;
      ctx.beginPath(); ctx.moveTo(cx,cy-4); ctx.lineTo(cx+3,cy); ctx.lineTo(cx,cy+4); ctx.lineTo(cx-3,cy); ctx.closePath(); ctx.fill();
    } else if(c==='o'){
      const cx=x*S+S/2, cy=y*S+S/2, r = 8 + Math.sin(now/200)*1.5;
      ctx.fillStyle = '#ffd84d';
      ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.lineTo(cx+r*0.7,cy); ctx.lineTo(cx,cy+r); ctx.lineTo(cx-r*0.7,cy); ctx.closePath(); ctx.fill();
    }
  }
  // enemies
  enemies.forEach(e => {
    const [ex,ey] = pos(e); const cx = ex*S+S/2, cy = ey*S+S/2;
    const scared = fright>0, blink = scared && fright<2 && Math.floor(now/150)%2;
    ctx.fillStyle = scared ? (blink ? '#fff' : '#7aa7ff') : '#e5384a';
    ctx.beginPath();
    const spikes = 8;
    for(let i=0;i<spikes*2;i++){
      const a = i*Math.PI/spikes + now/600;
      const r = i%2 ? 7 : 12;
      ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx-3,cy-1,2.6,0,7); ctx.arc(cx+3,cy-1,2.6,0,7); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(cx-3+e.dx,cy-1+e.dy,1.2,0,7); ctx.arc(cx+3+e.dx,cy-1+e.dy,1.2,0,7); ctx.fill();
  });
  // player slime
  const [px,py] = pos(player); const cx = px*S+S/2, cy = py*S+S/2;
  const squish = 1 + Math.sin(now/90)*0.06;
  ctx.fillStyle = '#2fe3b5';
  ctx.beginPath();
  ctx.ellipse(cx, cy+2, 11*squish, 10/squish, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy-1, 9, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx-4,cy-2,3.2,0,7); ctx.arc(cx+4,cy-2,3.2,0,7); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(cx-4+player.dx*1.5,cy-2+player.dy*1.5,1.6,0,7); ctx.arc(cx+4+player.dx*1.5,cy-2+player.dy*1.5,1.6,0,7); ctx.fill();

  if(state!=='play'){
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 36px system-ui';
    ctx.fillText(state==='win' ? 'You Win! 🎉' : 'Game Over', cv.width/2, cv.height/2-8);
    ctx.font = '18px system-ui';
    ctx.fillText('Score: '+score+'  —  Press Space or tap to try again! 💀😂', cv.width/2, cv.height/2+28);
  }
}

function loop(now){
  const dt = (now - t0)/1000; t0 = now;
  update(dt); draw(now);
  requestAnimationFrame(loop);
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const m = {arrowright:[1,0], d:[1,0], arrowleft:[-1,0], a:[-1,0], arrowdown:[0,1], s:[0,1], arrowup:[0,-1], w:[0,-1]};
  if(m[k]){ want = m[k]; e.preventDefault(); }
  if(k===' ' && state!=='play'){ reset(true); e.preventDefault(); }
});
let sx=0, sy=0;
cv.addEventListener('touchstart', e => { sx=e.touches[0].clientX; sy=e.touches[0].clientY; if(state!=='play') reset(true); });
cv.addEventListener('touchmove', e => {
  const dx = e.touches[0].clientX-sx, dy = e.touches[0].clientY-sy;
  if(Math.hypot(dx,dy)>20){
    want = Math.abs(dx)>Math.abs(dy) ? [Math.sign(dx),0] : [0,Math.sign(dy)];
    sx=e.touches[0].clientX; sy=e.touches[0].clientY;
  }
  e.preventDefault();
}, {passive:false});

reset(true);
requestAnimationFrame(t => { t0 = t; loop(t); });
</script>
</body>
</html>
